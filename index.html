/* ============================================================================
   TAB 7 — Trends & month on month
   ========================================================================== */
function monthAgg(k) { return agg(D.filter(r => r.date.slice(0, 7) === k)); }
function tabTrends() {
  const A = V.A, C = V.C, P = V.P, months = DATA.months;
  const MA = months.map(k => ({ k, a: monthAgg(k) }));
  const single = months.length < 2;

  const momRow = (label, f, fmt) => '<tr><td class="l">' + label + '</td>' +
    MA.map((m, i) => {
      const cur = f(m.a), prev = i > 0 ? f(MA[i - 1].a) : null;
      return '<td>' + fmt(cur) + '</td><td>' + (i === 0 ? '<span class="na">no prior month</span>' :
        (typeof cur === 'number' && typeof prev === 'number' ? deltaPct(cur, prev) : NC)) + '</td>';
    }).join('') + '</tr>';
  const momHead = [{ n: 'Metric', l: 1 }].concat(MA.flatMap(m => [{ n: monthLabel(m.k) }, { n: 'MoM' }]));

  let h = '';
  h += '<div class="note ' + (single ? 'a' : 'b') + '" style="margin-bottom:14px"><b>Months present in the workbook: ' +
    months.map(monthLabel).join(', ') + '.</b> ' +
    (single ? 'Only one month of daily data exists (' + rangeLabel(MIN_D, MAX_D) + '), so month-on-month growth cannot be calculated and no prior month has been simulated. ' +
      'The month table below reports the month to date; the period comparison engine underneath is the closest available substitute.'
      : 'Month-on-month growth is calculated against the immediately preceding month.') + '</div>';

  h += sec('Overall month on month', 'month to date where the month is incomplete',
    card('', '', table(momHead, [
      momRow('Total GMV', a => a.gmv, money),
      momRow('Target', a => a.target, money),
      momRow('Achievement', a => a.ach, v => pct(v, 1)),
      momRow('Recorded spend', a => a.spend, money),
      momRow('Blended ROAS', a => a.blendedRoas, v => xs(v)),
      momRow('Website GMV', a => a.ch.website.gmv, money),
      momRow('Amazon GMV', a => a.ch.amazon.gmv, money),
      momRow('Blinkit GMV', a => a.ch.blinkit.gmv, money),
      momRow('BIK GMV (in website)', a => a.bikGmv, money),
      momRow('Other 3P GMV', a => a.other3p, money)
    ].join('')), 'pad0'));

  h += sec('Website month on month', '',
    card('', '', table(momHead, [
      momRow('Traffic', a => a.traffic, v => num(v)),
      momRow('Add to cart', a => a.atc, v => num(v)),
      momRow('Orders', a => a.orders, v => num(v)),
      momRow('Conversion', a => a.conv, v => pct(v, 2)),
      momRow('AOV', a => a.aov, money),
      momRow('GMV', a => a.webGmv, money),
      momRow('Cost per order', a => a.cpu, money),
      momRow('Marketing spend', a => a.markSpend, money),
      momRow('Returning share of orders', a => a.returningRate, v => pct(v, 1))
    ].join('')), 'pad0'));

  h += sec('Channel month on month', 'contribution is the share of that month\'s GMV',
    card('', '', table(
      [{ n: 'Channel', l: 1 }].concat(MA.flatMap(m => [{ n: monthLabel(m.k) + ' GMV' }, { n: 'Share' }, { n: 'Spend' }, { n: 'ROAS' }, { n: 'MoM' }])),
      CHANNELS.map(c => '<tr><td class="l"><span class="dotc" style="background:' + c.hex + '"></span> ' + c.name + '</td>' +
        MA.map((m, i) => {
          const cr = channelRows(m.a, i > 0 ? MA[i - 1].a : null, m.a).find(x => x.id === c.id);
          return '<td>' + money(cr.gmv) + '</td><td>' + pct(cr.share, 1) + '</td>' +
            '<td>' + (cr.noSpend ? '<span class="na">n/a</span>' : cr.spend == null ? NA : money(cr.spend)) + '</td>' +
            '<td>' + (cr.noSpend ? '<span class="na">n/a</span>' : cr.roas == null ? NA : xs(cr.roas)) + '</td>' +
            '<td>' + (i === 0 ? '<span class="na">no prior month</span>' : deltaPct(cr.gmv, cr.prevGmv)) + '</td>';
        }).join('') + '</tr>').join('')), 'pad0'));

  /* period comparison engine */
  const rowsCmp = [
    ['Total GMV', C.gmv, P && P.gmv, money, 'pct'],
    ['Target', C.target, P && P.target, money, 'pct', 'n'],
    ['Achievement', C.ach, P && P.ach, v => pct(v, 1), 'bps'],
    ['Recorded spend', C.spend, P && P.spend, money, 'pct', 'n'],
    ['Blended ROAS', C.blendedRoas, P && P.blendedRoas, v => xs(v), 'pct'],
    ['Website GMV', C.ch.website.gmv, P && P.ch.website.gmv, money, 'pct'],
    ['Website traffic', C.traffic, P && P.traffic, v => num(v), 'pct'],
    ['Conversion', C.conv, P && P.conv, v => pct(v, 2), 'bps'],
    ['AOV', C.aov, P && P.aov, money, 'pct'],
    ['Orders', C.orders, P && P.orders, v => num(v), 'pct'],
    ['Cost per order', C.cpu, P && P.cpu, money, 'pct'],
    ['Amazon GMV', C.ch.amazon.gmv, P && P.ch.amazon.gmv, money, 'pct'],
    ['Blinkit GMV', C.ch.blinkit.gmv, P && P.ch.blinkit.gmv, money, 'pct'],
    ['Returning share of orders', C.returningRate, P && P.returningRate, v => pct(v, 1), 'bps']
  ];
  h += sec('Period comparison engine', V.hasCmp ? V.cmp.label : 'no comparison available',
    (V.hasCmp ? '' : '<div class="note a" style="margin-bottom:10px">' + (V.cmp.note || '') + '</div>') +
    card('', '', table(
      [{ n: 'Metric', l: 1 }, { n: 'Comparison period' }, { n: 'Current' }, { n: 'Absolute change' }, { n: 'Change' }],
      rowsCmp.map(r => {
        const [n, c, p, f, kind, nu] = r;
        const d = (c != null && p != null) ? c - p : null;
        const abs = d == null ? '—'
          : kind === 'bps' ? (d > 0 ? '+' : '−') + Math.abs(Math.round(d * 10000)) + ' bps'
          : f === money ? sgnMoney(d) : (d > 0 ? '+' : '') + f(d);
        return '<tr><td class="l">' + n + '</td><td>' + (p == null ? NC : f(p)) + '</td><td>' + (c == null ? NA : f(c)) +
          '</td><td>' + abs + '</td><td>' + (kind === 'bps' ? deltaBps(c, p, nu) : deltaPct(c, p, nu)) + '</td></tr>';
      }).join('')), 'pad0'));

  /* trend charts with metric toggles */
  const tog = (key, list, def) => {
    const on = state.toggles[key] || def;
    return '<div class="toggles">' + list.map(m => '<button class="' + (on.includes(m) ? 'on' : '') +
      '" onclick="toggleMetric(\'' + key + '\',\'' + m + '\',\'' + def.join('|') + '\')">' + m + '</button>').join('') + '</div>';
  };
  h += sec('Overall trend', tog('trOv', ['GMV', 'Target', 'Spend', 'ROAS', 'Achievement'], ['GMV', 'Target']),
    card('', '', canvas('t7_overall', 'h280')));
  h += sec('Website trend', tog('trWeb', ['Traffic', 'Conversion', 'Orders', 'AOV', 'GMV', 'CPU'], ['Traffic', 'Conversion']),
    card('', '', canvas('t7_web', 'h280')));
  h += sec('Channel trend', 'GMV by channel, daily',
    card('', '', canvas('t7_chan', 'h280')));
  return h;
}

function tabInsights() {
  const A = V.A, C = V.C, P = V.P, s = story(), al = alerts(s);

    insBox('g', '🟢 What is going well', al.good) +
    insBox('b', '📌 Management actions', al.act) + '</div>');

  /* observation / interpretation / action */
  const blocks = [];
  if (A.ach != null)
    blocks.push(oia('Position against plan',
      'Combined GMV of ' + money(A.gmvForPlan) + ' against a plan of ' + money(A.target) + ' is ' + pct(A.ach, 1) +
        ' of target, a variance of ' + money(A.variance) + ' across ' + A.targetDays + (A.targetDays < A.days ? ' of ' + A.days : '') +
        ' days. Website alone is at ' + pct(A.dabbleAch, 1) +
        ' of its plan while the combined figure is ' + pct(A.ach, 1) + '.',
      A.dabbleAch > A.ach
        ? 'The website is carrying the plan and the marketplaces are the source of the shortfall: website is ' +
          money(A.dabbleVar) + ' ahead while the combined position is ' + money(A.variance) + '.'
        : 'The marketplaces are covering for a website that is behind its own plan.',
      A.ach < 1
        ? 'Rebase the marketplace plan or fund the gap: ' + money(Math.abs(A.variance)) + ' over ' + A.targetDays +
          ' days runs at ' + money(Math.abs(A.variance) / A.targetDays) + ' a day.'
        : 'Hold the current plan and confirm the target itself is not set too low, given ' + s.above + ' of ' + s.days.length + ' days cleared it.'));

  if (s.dec)
    blocks.push(oia('What is moving website GMV',
      'Over ' + s.cmp.label + ', website GMV moved ' + sgnMoney(s.dec.total) + '. Traffic contributed ' + sgnMoney(s.dec.trafficEff) +
        ', conversion ' + sgnMoney(s.dec.convEff) + ' and AOV ' + sgnMoney(s.dec.aovEff) + '.',
      'The data indicates ' + (/^[aeiou]/i.test(s.dec.lead.k) ? 'an ' : 'a ') + s.dec.lead.k.toLowerCase() + '-led movement: that term alone accounts for ' + sgnMoney(s.dec.lead.v) +
        ' of the change. No causal driver is asserted here; the decomposition only attributes the arithmetic.',
      s.dec.lead.k === 'Traffic' && s.dec.trafficEff < 0
        ? 'Start with the traffic decline of ' + num(Math.round(P.traffic - C.traffic)) + ' visits' +
          (s.dec.convEff < 0 ? ', then the ' + money(Math.abs(s.dec.convEff)) + ' conversion drag behind it.' : ', while protecting the conversion rate that is currently holding.')
        : s.dec.lead.k === 'Conversion' && s.dec.convEff < 0
          ? 'Treat conversion as the priority: it is removing ' + money(Math.abs(s.dec.convEff)) + ' before any traffic decision.'
          : s.dec.lead.k === 'AOV' && s.dec.aovEff < 0
            ? 'Check basket mix and discounting: AOV is removing ' + money(Math.abs(s.dec.aovEff)) + ' on its own.'
            : 'Sustain what is working and test whether it holds at higher traffic volume.'));

  if (s.spendGap != null)
    blocks.push(oia('Spend efficiency',
      'Recorded spend moved ' + sgnPct(s.spendGrowth) + ' while GMV moved ' + sgnPct(s.gmvGrowth) + '. Blended ROAS went from ' +
        xs(P.blendedRoas) + ' to ' + xs(C.blendedRoas) + ', with spend at ' + pct(A.spendGmvRatio, 1) + ' of GMV for the full range.',
      s.spendGap > CFG.spendGap
        ? 'Spend is clearly outrunning revenue: each additional rupee is buying materially less GMV than it did in the comparison window.'
        : s.spendGap > 0
          ? 'Spend is running slightly ahead of revenue — a ' + (s.spendGap * 100).toFixed(1) + ' point gap, inside the ' +
            pct(CFG.spendGap, 0) + ' tolerance but pointed the wrong way.'
          : 'Revenue is outrunning spend, so efficiency has improved over the comparison window.',
      s.spendGap > CFG.spendGap
        ? 'Freeze incremental budget on the fastest-growing line until ROAS recovers to ' + xs(CFG.roasFloor) + '.'
        : s.spendGap > 0
          ? 'Hold budget flat and watch the gap: it becomes an escalation if it passes ' + pct(CFG.spendGap, 0) + '.'
          : 'Consider testing incremental budget while the efficiency holds, with a stop-loss at ' + xs(CFG.roasFloor) + '.'));

  if (s.concentration != null)
    blocks.push(oia('Channel concentration',
      s.top.name + ' accounts for ' + pct(s.top.share, 1) + ' of GMV (' + money(s.top.gmv) + '). The next largest is ' +
        s.channelsAll.sort((a, b) => (b.gmv || 0) - (a.gmv || 0))[1].name + ' at ' +
        pct(s.channelsAll.sort((a, b) => (b.gmv || 0) - (a.gmv || 0))[1].share, 1) + '.',
      s.concentration > CFG.concentration
        ? 'Revenue is concentrated above the ' + pct(CFG.concentration, 0) + ' threshold, so a policy, listing or fee change at ' + s.top.name + ' would move the whole business.'
        : 'The mix is reasonably spread, so no single channel currently dictates the total.',
      s.concentration > CFG.concentration
        ? 'Set a concentration ceiling and a contingency for ' + s.top.name + ' disruption; track owned-channel share weekly.'
        : 'Keep monitoring; no action required at this level of spread.'));

  h += sec('Observation, interpretation, action', 'the interpretation column states what the data supports, not what caused it',
    '<div class="grid g2">' + blocks.join('') + '</div>');

  /* reconciliation */
  h += sec('Reconciliation of headline totals', 'run against the workbook before any figure was displayed',
    card('', '', DATA.recon.map(r =>
      '<div class="recon-row"><div><div class="n">' + r.check + '</div><div class="x">' + r.note + '</div></div>' +
      '<div class="r">' + (r.status === 'pass' ? stateChip('g', 'reconciles') : r.status === 'flag' ? stateChip('r', 'discrepancy') : stateChip('a', 'unavailable')) +
      '<div style="margin-top:4px;color:var(--text-3)">' + (r.a == null ? '' : inr(r.a) + ' vs ' + inr(r.b) +
        (r.delta ? ' · Δ ' + inr(r.delta) : ' · exact')) + '</div></div></div>').join('')));

  /* data availability */
  h += sec('Data availability', 'these states are preserved throughout the dashboard and never replaced with zero',
    '<div class="grid g2">' + DATA.dq.map(d =>
      '<div class="oia"><div class="t">' + (d.level === 'warn' ? '🟠 ' : '⚪ ') + d.title + '</div>' +
      '<div style="font-size:12.6px;line-height:1.55;color:var(--text-2)">' + d.detail + '</div></div>').join('') + '</div>');
  return h;
}

/* ============================================================================
   Boot
   ========================================================================== */
const TABS = [
  { id: 'overview', n: 'Executive overview', r: tabOverview, a: afterOverview },
  { id: 'target', n: 'Target vs actual', r: tabTarget, a: afterTarget },
  { id: 'pnl', n: 'Daily P&L', r: tabPnl, a: afterPnl },
  { id: 'funnel', n: 'Website funnel', r: tabFunnel, a: afterFunnel },
  { id: 'channels', n: 'Channel performance', r: tabChannels, a: afterChannels },
  { id: 'spend', n: 'Spend & ROAS', r: tabSpend, a: afterSpend },
  { id: 'market', n: 'Amazon · BIK', r: tabMarket, a: afterMarket },
  { id: 'trends', n: 'Trends & MoM', r: tabTrends, a: afterTrends },
  { id: 'daily', n: 'Daily & weekly', r: tabDaily, a: afterDaily },
  { id: 'insights', n: 'Insights & actions', r: tabInsights, a: null }
];

const PRESETS = [
  { id: 'latest', n: 'Latest day' }, { id: 'prev', n: 'Day before' },
  { id: 'last7', n: 'Last 7 days' }, { id: 'prev7', n: 'Previous 7 days' },
  { id: 'mtd', n: 'Month to date' }, { id: 'prevmonth', n: 'Previous month' },
  { id: 'all', n: 'All data' }, { id: 'custom', n: 'Custom' }
];
function applyPreset(id) {
  const last = MAX_D;
  const clamp = d => d < MIN_D ? MIN_D : d > MAX_D ? MAX_D : d;
  if (id === 'latest') { state.start = state.end = last; }
  else if (id === 'prev') { const p = ALL_DATES[ALL_DATES.length - 2] || last; state.start = state.end = p; }
  else if (id === 'last7') { state.end = last; state.start = clamp(addDays(last, -6)); }
  else if (id === 'prev7') { state.end = clamp(addDays(last, -7)); state.start = clamp(addDays(last, -13)); }
  else if (id === 'mtd') { state.end = last; state.start = clamp(last.slice(0, 8) + '01'); }
  else if (id === 'prevmonth') {
    const m = DATA.months[DATA.months.indexOf(last.slice(0, 7)) - 1];
    if (!m) { alert('The workbook contains only ' + DATA.months.map(monthLabel).join(', ') + '. There is no previous month to show.'); return false; }
    const ds = ALL_DATES.filter(d => d.slice(0, 7) === m);
    state.start = ds[0]; state.end = ds[ds.length - 1];
  } else if (id === 'all') { state.start = MIN_D; state.end = MAX_D; }
  state.preset = id;
  return true;
}
function setToggle(k, v) { state.toggles[k] = v; render(); }
function setSort(k, v) { state.sort[k] = v; render(); }
function setDrill(v) { state.drill = v; render(); }
function toggleMetric(key, m, def) {
  const cur = state.toggles[key] || def.split('|');
  const next = cur.includes(m) ? cur.filter(x => x !== m) : cur.concat([m]);
  state.toggles[key] = next.length ? next : [m];
  render();
}

function render() {
  build();
  /* nav */
  document.getElementById('nav').innerHTML = TABS.map((t, i) =>
    '<button class="' + (state.tab === t.id ? 'on' : '') + '" onclick="goTab(\'' + t.id + '\')">' +
    '<span class="n">' + (i + 1) + '</span>' + t.n + '</button>').join('');
  /* presets */
  document.getElementById('presets').innerHTML = PRESETS.map(p =>
    '<button class="' + (state.preset === p.id ? 'on' : '') + '" onclick="goPreset(\'' + p.id + '\')">' + p.n + '</button>').join('');
  document.getElementById('dStart').value = state.start;
  document.getElementById('dEnd').value = state.end;
  document.getElementById('rangePill').textContent = rangeLabel(state.start, state.end) + ' · ' + V.rows.length + ' days';
  const bs = document.getElementById('basis');
  bs.className = 'basis' + (V.cmp.kind === 'prev' ? ' neutral' : '');
  bs.innerHTML = '<b>Comparison basis</b><span>' +
    (V.hasCmp ? V.cmp.label + ' — ' + V.cmp.note : (V.cmp.note || V.cmp.label)) + '</span>';
  /* view */
  const t = TABS.find(x => x.id === state.tab);
  document.getElementById('views').innerHTML = '<div class="view on">' + t.r() + '</div>';
  if (t.a) t.a();
}
function goTab(id) { state.tab = id; state.drill = null; render(); window.scrollTo({ top: 0 }); }
function goPreset(id) {
  if (id === 'custom') { state.preset = 'custom'; render(); return; }
  if (applyPreset(id)) render();
}

document.getElementById('dStart').min = MIN_D; document.getElementById('dStart').max = MAX_D;
document.getElementById('dEnd').min = MIN_D; document.getElementById('dEnd').max = MAX_D;
document.getElementById('dStart').addEventListener('change', e => {
  state.start = e.target.value; if (state.start > state.end) state.end = state.start; state.preset = 'custom'; render();
});
document.getElementById('dEnd').addEventListener('change', e => {
  state.end = e.target.value; if (state.end < state.start) state.start = state.end; state.preset = 'custom'; render();
});
const cs = document.getElementById('chanSel');
cs.innerHTML = '<option value="all">All channels</option>' + CHANNELS.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');
cs.addEventListener('change', e => { state.channel = e.target.value; state.drill = e.target.value === 'all' ? null : e.target.value; render(); });
document.getElementById('cmpSel').addEventListener('change', e => { state.cmp = e.target.value; render(); });
document.getElementById('brandSub').innerHTML = DATA.sheets.length + ' sheets · ' + rangeLabel(MIN_D, MAX_D) + '<br>' + ALL_DATES.length + ' days of daily data';
// Was a hand-written, never-updated filename in shell.html (left over from whichever
// workbook the template was first built against) — now driven from the actual source the
// data was extracted from, so it can't go stale again on a differently-named workbook.
document.getElementById('railFoot').innerHTML = 'Source <b>' + DATA.source + '</b><br>' + DATA.sheets.length + ' sheets · figures as recorded';

applyPreset('mtd');
render();
</script>
</body>
